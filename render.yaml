databases:
  - name: anchor-db
    plan: free
    region: oregon

services:
  - type: web
    name: anchor-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agents.watcher:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        value: "86192318VE190694L"
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: API_SECRET
        generateValue: true
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: MERCHANT_ID
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: APPROVAL_TOKEN_SECRET
        generateValue: true
      - key: AUTO_ACCEPT_BELOW
        value: "60"
      - key: AUTO_FIGHT_ABOVE
        value: "200"
      - key: AUTO_FIGHT_MIN_PROB
        value: "0.60"
      - key: SELLER_ACCOUNT_AGE_DAYS
        value: "730"
      - key: SELLER_HOURLY_RATE
        value: "50"
      - key: SELLER_WIN_RATE
        value: "0.5"
      - key: MERCHANT_EMAIL
        sync: false
      - key: ASTRO_GATEWAY_URL
        sync: false
      - key: ASTRO_GATEWAY_API_KEY
        sync: false
      - key: ANCHOR_AI_MODEL
        value: claude-sonnet-4-6
      - key: RECOVERY_DELAY_MINUTES
        value: "30"
      - key: RECOVERY_MIN_AMOUNT
        value: "10"
      - key: RECOVERY_MAX_ATTEMPTS
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: anchor-db
          property: connectionString
      - key: PAYPAL_ENV
        value: "sandbox"
      - key: SHADOW_MODE
        value: "1"
      - key: MERCHANT_POLICY_LOADED
        value: "0"
      - key: WEBHOOK_OUTBOX_ENABLED
        value: "1"
      - key: REQUIRE_DURABLE_WEBHOOKS
        value: "1"
      - key: RUN_SCHEDULER
        value: "1"
      - key: RECOVERY_VALIDATION_ENABLED
        value: "1"
      - key: AUTONOMOUS_ACTIONS_ENABLED
        value: "0"
      - key: APPROVAL_LINK_MAX_AGE
        value: "3600"
      - key: RECOVERY_MERCHANT_OPT_IN
        value: "0"
      - key: ANCHOR_RETAIN_DAYS
        value: "90"
      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: worker
    name: anchor-worker
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.webhook_worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anchor-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        fromService:
          name: anchor-api
          type: web
          envVarKey: PAYPAL_CLIENT_ID
      - key: PAYPAL_CLIENT_SECRET
        fromService:
          name: anchor-api
          type: web
          envVarKey: PAYPAL_CLIENT_SECRET
      - key: PAYPAL_MERCHANT_ID
        fromService:
          name: anchor-api
          type: web
          envVarKey: PAYPAL_MERCHANT_ID
      - key: MERCHANT_ID
        fromService:
          name: anchor-api
          type: web
          envVarKey: MERCHANT_ID
      - key: MERCHANT_EMAIL
        fromService:
          name: anchor-api
          type: web
          envVarKey: MERCHANT_EMAIL
      - key: SLACK_WEBHOOK_URL
        fromService:
          name: anchor-api
          type: web
          envVarKey: SLACK_WEBHOOK_URL
      - key: PAYPAL_ENV
        value: "sandbox"
      - key: SHADOW_MODE
        value: "1"
      - key: WEBHOOK_OUTBOX_ENABLED
        value: "1"
      - key: REQUIRE_DURABLE_WEBHOOKS
        value: "1"
      - key: RUN_SCHEDULER
        value: "0"
      - key: AUTONOMOUS_ACTIONS_ENABLED
        value: "0"
      - key: RECOVERY_MERCHANT_OPT_IN
        value: "0"
      - key: RECOVERY_VALIDATION_ENABLED
        value: "1"
      - key: APPROVAL_LINK_MAX_AGE
        value: "3600"
      - key: ANCHOR_RETAIN_DAYS
        value: "90"
      - key: PAYPAL_WEBHOOK_ID
        value: "86192318VE190694L"
      - key: PYTHON_VERSION
        value: "3.12.0"
